name: ubbbair

services:
  postgres:
    build: ./postgres
    image: ubbbair-postgres:16
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?Set POSTGRES_DB in the project .env file}
      POSTGRES_USER: ${POSTGRES_USER:?Set POSTGRES_USER in the project .env file}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in the project .env file}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 20

  redis:
    image: redis:7-alpine
    ports:
      - "127.0.0.1:${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes

  seed:
    build:
      context: ../backend
      dockerfile: Dockerfile
    image: ubbbair-backend
    working_dir: /pipeline
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      MIGRATIONS_DIR: /migrations
      PYTHONDONTWRITEBYTECODE: "1"
    volumes:
      - ../data-pipeline:/pipeline:ro
      - ../database/migrations:/migrations:ro
    depends_on:
      postgres:
        condition: service_healthy
    command: python seed_demo.py
    restart: "no"

  backend:
    image: ubbbair-backend
    ports:
      - "8000:8000"
    env_file:
      - path: ../.env
        required: false
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      REDIS_URL: redis://redis:6379
      LLM_PROVIDER: ${LLM_PROVIDER:-groq}
      GROQ_API_KEY: ${GROQ_API_KEY:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
    depends_on:
      seed:
        condition: service_completed_successfully
      redis:
        condition: service_started
    volumes:
      - ../backend:/app
      - ../data-pipeline/output:/data-pipeline-output:ro
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    restart: unless-stopped

  frontend:
    build:
      context: ../frontend
      args:
        API_URL: http://backend:8000
    image: ubbbair-frontend
    ports:
      - "3000:3000"
    depends_on:
      - backend
    restart: unless-stopped

  pipeline:
    image: ubbbair-backend
    profiles: ["pipeline"]
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ../data-pipeline:/app
    command: python scheduler.py

volumes:
  postgres_data:
  redis_data:
